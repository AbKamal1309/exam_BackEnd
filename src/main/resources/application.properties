#spring.h2.console.enabled=true

# ── Port ─────────────────────────────────────────────────────────
# La plupart des hébergeurs imposent leur propre port via la variable PORT ;
# ${PORT:8085} veut dire "utilise PORT si définie, sinon 8085 en local".
server.port=${PORT:8085}

# ── Base de données ──────────────────────────────────────────────
# En local, ces valeurs par défaut (après le ":") sont utilisées tel quel.
# Une fois déployé, définissez DB_URL / DB_USERNAME / DB_PASSWORD comme
# variables d'environnement sur l'hébergeur — ne JAMAIS committer les vraies
# valeurs de production dans ce fichier.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Exam?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ⚠️ "create" supprime et recrée TOUTES les tables à chaque redémarrage —
# fonctionnait en local car on ne redémarre jamais "par accident", mais sur un
# serveur hébergé (redéploiements, veille, crash) ça effacerait toutes les
# données à chaque fois. "update" les préserve et ajoute seulement ce qui
# manque.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=${SHOW_SQL:true}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Stockage des pièces jointes ──────────────────────────────────
# ⚠️ À revoir selon l'hébergeur choisi : sur la plupart des plateformes, le
# disque est éphémère (fichiers perdus à chaque redémarrage/déploiement).
# Un disque persistant ou un stockage objet (S3-compatible) sera nécessaire —
# à traiter une fois l'hébergeur choisi.
app.upload.dir=${UPLOAD_DIR:uploads}

# ── Secrets ──────────────────────────────────────────────────────
# ⚠️ REMPLACEZ les deux valeurs par défaut ci-dessous par VOS NOUVEAUX secrets
# régénérés (celles-ci ne sont que des exemples de repli pour le dev local).
# En production, définissez plutôt JWT_SECRET et DEEPSEEK_API_KEY comme
# variables d'environnement sur l'hébergeur — ne jamais committer les vraies
# valeurs.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.google.client-id=${GOOGLE_CLIENT_ID:744131153960-dg5pk850gjgdbj5dbu7255ql1kv7lvqr.apps.googleusercontent.com}
app.deepseek.api-key=${DEEPSEEK_API_KEY:}
app.deepseek.base-url=https://api.deepseek.com
app.deepseek.model=deepseek-v4-flash

server.error.include-message=always
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:Kamal@gmail.com}
spring.profiles.active=${SPRING_PROFILE:dev}

# ── CORS ─────────────────────────────────────────────────────────
# Plusieurs origines séparées par des virgules si besoin (dev + prod à la fois).
# En production, définissez ALLOWED_ORIGINS avec l'URL réelle du frontend.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}